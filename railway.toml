# Railway config-as-code: a BATCH job, not a web service.  [swarm-kit: shared file, do not fork per repo]
# startCommand runs the repo's batch (docker/entrypoint.sh ci: make metrics/$CI_TARGET), publishes the results to
# the `metrics-data` branch, and exits; no healthcheck, never restarted.  It is explicit because some repos keep
# CMD ["make","check"] in the Dockerfile for plain `docker run` users.  A swarm service overrides it in Railway:
# `docker/entrypoint.sh swarm [--task docker/rr-swarm-task.md]`.
# Service variables (set in Railway, never in the repo): CLAUDE_CODE_OAUTH_TOKEN (swarm services only),
# GITHUB_TOKEN (fine-grained, this repo only, Contents read+write), optional METRICS_FLOWS / JOBS.
# Runs ON DEMAND (no schedule): when you click Redeploy on the Railway service, or when a push to the deployed
# branch changes anything except docs (watchPatterns).  To schedule it, add e.g. cronSchedule = "17 3 * * 0"
# (UTC, no daylight saving) under [deploy].  The service's own dashboard settings win over this file for restart
# policy and cron: keep Restart Policy = Never and the Cron Schedule field EMPTY there.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# gitignore-style; a `!` rule only removes what an earlier rule matched.  Docs/markdown/CI-only pushes don't run.
watchPatterns = ["**", "!**/*.md", "!docs/**", "!doc/**", "!.github/**", "!LICENSE*"]

[deploy]
startCommand = "docker/entrypoint.sh ci"
restartPolicyType = "NEVER"
