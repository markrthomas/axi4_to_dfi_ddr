name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sim-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Simulation, smokes, elab-fail, Verilator, Yosys syn + formal
        run: make -C test ci

  coverage:
    needs: sim-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verilator coverage (DFI bridge)
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info
          if-no-files-found: ignore

  cocotb:
    needs: sim-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          pip install cocotb==1.8.1

      - name: cocotb OSS UVM-equivalent tests (DFI bridge)
        run: make cocotb
