name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sim-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Simulation, smokes, elab-fail, Verilator, Yosys syn + formal
        run: make -C test ci

  coverage:
    needs: sim-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verilator coverage (DFI bridge)
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info
          if-no-files-found: ignore

  cocotb:
    needs: sim-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60  # <-- Change this to 60, 90, etc. (Default is 360)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          pip install cocotb==1.8.1

      - name: cocotb OSS UVM-equivalent tests (DFI bridge)
        run: make cocotb

  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Modern Yosys via the OSS CAD Suite (apt's yosys is too old for `ltp -noff` and
      # has different generic cell naming — matches the suite used by the sim/formal jobs).
      - name: Setup OSS CAD Suite (yosys) — retry transient download flakes
        uses: Wandalen/wretry.action@v3
        with:
          action: YosysHQ/setup-oss-cad-suite@v3
          with: |
            github-token: ${{ github.token }}
          attempt_limit: 3
          attempt_delay: 15000

      - name: T1 synthesizability gate (latch-free + area/timing-proxy ceilings)
        run: make synth

      - name: Structural AXI<->DFI CDC audit
        run: make cdc

      - name: T4 DFT scan-readiness audit (latch-free + no comb loops + flop inventory)
        run: make dft

      - name: T3 low-power UPF consistency lint
        run: make lp

      - name: T6 GLS (zero-delay gate-level sim vs the directed self-checking TB)
        run: make gls

      - name: T6 PPA proxy baseline (cells / flops / logic-depth)
        run: make ppa

      - name: T7 packaging — IP-XACT well-formed + structural + port-sync with RTL
        run: |
          command -v xmllint >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y libxml2-utils
          make pkg

      - name: Upload T6 GLS + PPA reports
        uses: actions/upload-artifact@v4
        with:
          name: t6-reports
          path: |
            syn/gls/reports/
            syn/ppa/reports/
          if-no-files-found: ignore

      - name: Upload gate-level netlist
        uses: actions/upload-artifact@v4
        with:
          name: synth-netlist
          path: sim/synth_netlist.v
          if-no-files-found: ignore

      - name: Upload DFT scan-readiness reports
        uses: actions/upload-artifact@v4
        with:
          name: dft-reports
          path: syn/dft/reports/
          if-no-files-found: ignore
