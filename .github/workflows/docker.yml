name: docker

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dv-image .
      - name: Run the light local gate inside the image
        run: docker run --rm dv-image
